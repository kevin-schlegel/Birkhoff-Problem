name: Verify Lean certificate

# Start explicitly from Actions > Verify Lean certificate > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the checked commit
        run: |
          mkdir -p .verification
          git rev-parse HEAD | tee .verification/commit.txt

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the Lean version manager
        run: |
          curl --fail --silent --show-error --location \
            https://elan.lean-lang.org/elan-init.sh \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned dependencies and mathlib cache
        timeout-minutes: 20
        run: |
          lake --version
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json

      - name: Verify every module and audit axioms
        id: certificate
        timeout-minutes: 330
        run: |
          python3 -u verify.py --jobs 2 2>&1 | tee .verification/console.log

      - name: Write verification summary
        if: always()
        env:
          CHECKED_COMMIT: ${{ github.sha }}
          VERIFICATION_OUTCOME: ${{ steps.certificate.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [
              "## Lean certificate verification",
              "",
              "Commit: `" + os.environ["CHECKED_COMMIT"] + "`",
              "",
              "Verification step: **" + os.environ["VERIFICATION_OUTCOME"] + "**",
          ]
          report = Path(".verification/result.json")
          if os.environ["VERIFICATION_OUTCOME"] == "success" and report.is_file():
              result = json.loads(report.read_text())
              lines += [
                  "",
                  "Checked modules: " + str(len(result["compiler_results"])),
                  "Audited declarations: " + str(result["audited_declarations"]),
                  "Axioms used: " + ", ".join(result["axioms_used"]),
              ]
          else:
              lines += ["", "No successful complete verification is recorded for this run."]
          lines += ["", "Download the run artifact for the report and module logs."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Save the verification report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-verification-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            .verification/commit.txt
            .verification/result.json
            .verification/build-state.json
            .verification/console.log
            .verification/logs/